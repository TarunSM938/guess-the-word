<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player home | Guess the Word</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

</html>
